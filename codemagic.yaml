workflows:
  ios-unsigned-ipa:
    name: Build Unsigned IPA for Sideloadly
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Node dependencies
        script: |
          npm install

      - name: Generate Native iOS Project (Expo Prebuild)
        script: |
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: |
          cd ios && pod install

      - name: Build Unsigned iOS App Archive
        script: |
          cd ios
          # Detect workspace and scheme names automatically
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(ls -d *.xcodeproj | head -n 1 | sed 's/\.xcodeproj//')

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into IPA
        script: |
          # Create Payload directory required by iOS IPA format
          mkdir -p build_output/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/*.app build_output/Payload/
          cd build_output
          zip -r app-unsigned.ipa Payload

    artifacts:
      - build_output/app-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
