name: Build Unsigned IPA for Sideloadly

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: macos-14 # Uses GitHub's free Mac runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Generate Native iOS Project
        run: npx expo prebuild --platform ios

      - name: Build Unsigned App with Xcode
        run: |
          cd ios
          xcodebuild -workspace *.xcworkspace -scheme $(ls -d *.xcodeproj | sed 's/\.xcodeproj//') \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -r ios/build/Release-iphoneos/*.app build/Payload/
          cd build
          zip -r app-unsigned.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned.ipa
          path: build/app-unsigned.ipa
